# ---------------------------------------------------------------
# CampusNav configuration
# Every value can be overridden with an environment variable,
# e.g.  PORT=9090 ADMIN_PASSWORD=Secret123 java -jar campusnav.jar
# ---------------------------------------------------------------
spring.application.name=campusnav
server.port=${PORT:8088}

# Embedded H2 database stored in a file next to where the app is started
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./campusnav-data/campusnav;AUTO_SERVER=TRUE}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JSON uses snake_case (from_node, total_distance_meters, ...) to match the frontend
spring.jackson.property-naming-strategy=SNAKE_CASE

# Login sessions last a week
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Seeded administrator account (created on first start if missing)
campusnav.admin.email=${ADMIN_EMAIL:admin@thapar.edu}
campusnav.admin.password=${ADMIN_PASSWORD:AdminPassword123!}

# Where the frontend lives during development (falls back to the copy bundled in the jar)
campusnav.frontend-dir=${FRONTEND_DIR:}
